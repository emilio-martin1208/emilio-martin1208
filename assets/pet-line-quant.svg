<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Quant Pets</title>
  <desc id="desc">A Patagonia vest wearing quant bull and a market penguin take turns peeking above a cyan pixel rule, showing a laptop and market jokes, then hiding.</desc>
  <style>.p{shape-rendering:crispEdges}.t{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}</style>
  <defs><clipPath id="stage"><rect width="1200" height="164"/></clipPath></defs>

  <g clip-path="url(#stage)" class="p">
    <!-- Patagonia and Arc'teryx quant bull -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 130;0 130;0 0;0 0;0 130" keyTimes="0;.05;.16;.43;.52" dur="10s" repeatCount="indefinite"/>
      <path d="M136 84h18V68h16v22h12V62h13v33h-8v51h-66V95h-8V62h13v28h10z" fill="#9B6545"/>
      <path d="M113 62h13v18h-8zm69 0h13v18h-5z" fill="#E7C09F"/>
      <rect x="128" y="94" width="52" height="45" fill="#D59A72"/>
      <rect x="136" y="105" width="7" height="7" fill="#171A33"/><rect x="165" y="105" width="7" height="7" fill="#171A33"/>
      <rect x="145" y="122" width="19" height="6" fill="#6C3F33"/>
      <rect x="112" y="139" width="84" height="42" fill="#173B54"/>
      <rect x="149" y="139" width="10" height="42" fill="#25C7D9"/>
      <path d="M121 148l8-7 8 7-8 7z" fill="#F46A5A"/>
      <text x="116" y="174" fill="#8CEAF0" class="t">PATA</text>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 35;0 35;0 0;0 0;0 35" keyTimes="0;.20;.26;.43;.52" dur="10s" repeatCount="indefinite"/>
        <rect x="187" y="125" width="78" height="50" fill="#34436F"/>
        <rect x="194" y="132" width="64" height="34" fill="#171A33"/>
        <path d="M204 155l10-8 10 5 12-18 12 22z" fill="#25C7D9"/>
      </g>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.14;.18;.42;.47;1" dur="10s" repeatCount="indefinite"/>
      <path d="M291 72h182v47H330l-16 16 1-16h-24z" fill="#D8FAFC" stroke="#25C7D9" stroke-width="3"/>
      <text x="309" y="101" fill="#20233F" class="t">BPS ARE UP, BRO.</text>
    </g>

    <!-- Market penguin -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 130;0 130;0 0;0 0;0 130" keyTimes="0;.52;.63;.91;1" dur="10s" repeatCount="indefinite"/>
      <rect x="934" y="88" width="66" height="72" fill="#20233F"/>
      <rect x="947" y="99" width="42" height="49" fill="#EEFDFE"/>
      <rect x="944" y="82" width="18" height="18" fill="#20233F"/><rect x="976" y="82" width="18" height="18" fill="#20233F"/>
      <rect x="953" y="109" width="7" height="7" fill="#171A33"/><rect x="977" y="109" width="7" height="7" fill="#171A33"/>
      <path d="M964 120h13l-6 10z" fill="#FFB000"/>
      <rect x="923" y="150" width="88" height="35" fill="#314071"/>
      <rect x="931" y="156" width="72" height="24" fill="#171A33"/>
      <path d="M941 172l10-8 10 5 12-9 20 15h-52z" fill="#F46A5A"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.61;.66;.9;1" dur="10s" repeatCount="indefinite"/>
      <path d="M704 76h204v47h162v-47z" fill="none"/>
      <path d="M720 76h196v47h-25l1 15-16-15H720z" fill="#FFF2CD" stroke="#FFB000" stroke-width="3"/>
      <text x="742" y="105" fill="#20233F" class="t">PRICED IN. PROBABLY.</text>
    </g>
  </g>
  <rect y="162" width="1200" height="4" fill="#25C7D9"/>
  <rect x="0" y="162" width="92" height="4" fill="#8CEAF0"/><rect x="1108" y="162" width="92" height="4" fill="#F46A5A"/>
  <rect x="18" y="176" width="7" height="7" fill="#25C7D9"/><rect x="1175" y="176" width="7" height="7" fill="#FFB000"/>
</svg>
