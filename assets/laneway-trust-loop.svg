<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Laneway trust loop</title>
  <desc id="desc">A golden claim moves from traveler request through planning, sources, composition, and verification before becoming cyan guidance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17172A"/><stop offset="1" stop-color="#20233F"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text class="mono" x="52" y="54" fill="#8CEAF0" font-size="13" font-weight="700" letter-spacing="2">ONE CLAIM / ONE TRACEABLE PATH</text>
  <text class="sans" x="52" y="92" fill="#F7FBFC" font-size="24" font-weight="700">Reason slowly. Verify deterministically. Guide clearly.</text>

  <path d="M92 208H1100" stroke="#3D5388" stroke-width="5" stroke-dasharray="3 13" stroke-linecap="square"/>

  <g class="sans" text-anchor="middle">
    <g transform="translate(104 208)"><circle r="38" fill="#2B2B51" stroke="#F46A5A" stroke-width="3"/><text y="6" fill="#F7FBFC" font-size="22">?</text><text y="70" fill="#AAB2C8" font-size="14">TRAVELER</text></g>
    <g transform="translate(294 208)"><rect x="-50" y="-38" width="100" height="76" rx="14" fill="#2B2B51" stroke="#3C5E91" stroke-width="3"/><text y="5" fill="#F7FBFC" font-size="17" font-weight="700">PLAN</text><text y="70" fill="#AAB2C8" font-size="14">WHAT IS NEEDED?</text></g>
    <g transform="translate(500 208)"><rect x="-58" y="-38" width="116" height="76" rx="14" fill="#2B2B51" stroke="#25C7D9" stroke-width="3"/><text y="5" fill="#F7FBFC" font-size="17" font-weight="700">SOURCES</text><text y="70" fill="#AAB2C8" font-size="14">WHAT IS KNOWN?</text></g>
    <g transform="translate(720 208)"><rect x="-62" y="-38" width="124" height="76" rx="14" fill="#2B2B51" stroke="#8CEAF0" stroke-width="3"/><text y="5" fill="#F7FBFC" font-size="17" font-weight="700">COMPOSE</text><text y="70" fill="#AAB2C8" font-size="14">DOES IT CONNECT?</text></g>
    <g transform="translate(936 208)"><path d="M0-50L58 0L0 50L-58 0Z" fill="#2B2B51" stroke="#FFB000" stroke-width="3"/><text y="5" fill="#F7FBFC" font-size="16" font-weight="700">VERIFY</text><text y="78" fill="#FFD766" font-size="14">SUPPORTED?</text></g>
    <g transform="translate(1100 208)"><rect x="-40" y="-40" width="80" height="80" rx="40" fill="#25C7D9"/><path d="M-14 1L-3 13L18-15" fill="none" stroke="#17172A" stroke-width="8" stroke-linecap="square"/><text y="74" fill="#8CEAF0" font-size="14">GUIDANCE</text></g>
  </g>

  <rect class="motion" x="0" y="0" width="14" height="14" fill="#FFD766" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M104 208H294H500H720H936H1100" keyTimes="0;0.18;0.38;0.59;0.8;1" calcMode="linear"/>
  </rect>
  <circle class="motion" cx="1100" cy="208" r="50" fill="none" stroke="#8CEAF0" stroke-width="3">
    <animate attributeName="r" values="42;62;42" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <text class="mono" x="52" y="330" fill="#737D9B" font-size="12">UNSUPPORTED IS AN ANSWER. UNSOURCED IS A BUG.</text>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#8CEAF0" stroke-opacity="0.14" stroke-width="2"/>
</svg>
