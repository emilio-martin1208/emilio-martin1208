<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Public repository language composition</title>
  <desc id="desc">HTML 40.5 percent, Python 37.3 percent, TypeScript 11.9 percent, C++ 8.5 percent, and other languages 1.8 percent.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#17172A"/>
  <rect x="1" y="1" width="1198" height="398" fill="none" stroke="#8CEAF0" stroke-opacity="0.16" stroke-width="2"/>

  <g transform="translate(235 200) rotate(-90)">
    <circle r="122" fill="none" stroke="#252B51" stroke-width="58"/>
    <circle r="122" fill="none" stroke="#25C7D9" stroke-width="58" pathLength="100" stroke-dasharray="40.5 59.5" stroke-dashoffset="0"/>
    <circle r="122" fill="none" stroke="#8CEAF0" stroke-width="58" pathLength="100" stroke-dasharray="37.3 62.7" stroke-dashoffset="-40.5"/>
    <circle r="122" fill="none" stroke="#3D72A8" stroke-width="58" pathLength="100" stroke-dasharray="11.9 88.1" stroke-dashoffset="-77.8"/>
    <circle r="122" fill="none" stroke="#F46A5A" stroke-width="58" pathLength="100" stroke-dasharray="8.5 91.5" stroke-dashoffset="-89.7"/>
    <circle r="122" fill="none" stroke="#FFB000" stroke-width="58" pathLength="100" stroke-dasharray="1.8 98.2" stroke-dashoffset="-98.2"/>
  </g>
  <circle cx="235" cy="200" r="79" fill="#20233F"/>
  <text class="mono" x="235" y="190" fill="#8CEAF0" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.8">PUBLIC CODE</text>
  <text class="sans" x="235" y="224" fill="#F7FBFC" font-size="24" font-weight="700" text-anchor="middle">1.81 MB</text>

  <g transform="translate(510 80)">
    <text class="sans" x="0" y="0" fill="#F7FBFC" font-size="28" font-weight="700" letter-spacing="-0.6">Language composition</text>
    <text class="sans" x="0" y="33" fill="#858EAC" font-size="15">Measured from code bytes in public repositories</text>

    <g transform="translate(0 78)" class="sans" font-size="18">
      <circle cx="8" cy="0" r="8" fill="#25C7D9"/><text x="30" y="6" fill="#F7FBFC" font-weight="600">HTML</text><text x="520" y="6" fill="#8CEAF0" text-anchor="end" font-weight="700">40.5%</text>
      <path d="M0 30H520" stroke="#8CEAF0" stroke-opacity="0.12"/>
      <circle cx="8" cy="52" r="8" fill="#8CEAF0"/><text x="30" y="58" fill="#F7FBFC" font-weight="600">Python</text><text x="520" y="58" fill="#8CEAF0" text-anchor="end" font-weight="700">37.3%</text>
      <path d="M0 82H520" stroke="#8CEAF0" stroke-opacity="0.12"/>
      <circle cx="8" cy="104" r="8" fill="#3D72A8"/><text x="30" y="110" fill="#F7FBFC" font-weight="600">TypeScript</text><text x="520" y="110" fill="#8CEAF0" text-anchor="end" font-weight="700">11.9%</text>
      <path d="M0 134H520" stroke="#8CEAF0" stroke-opacity="0.12"/>
      <circle cx="8" cy="156" r="8" fill="#F46A5A"/><text x="30" y="162" fill="#F7FBFC" font-weight="600">C++</text><text x="520" y="162" fill="#8CEAF0" text-anchor="end" font-weight="700">8.5%</text>
      <path d="M0 186H520" stroke="#8CEAF0" stroke-opacity="0.12"/>
      <circle cx="8" cy="208" r="8" fill="#FFB000"/><text x="30" y="214" fill="#F7FBFC" font-weight="600">Other</text><text x="520" y="214" fill="#FFD766" text-anchor="end" font-weight="700">1.8%</text>
    </g>
  </g>
</svg>
