<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Cybersecurity Pets</title>
  <desc id="desc">A green hoodie cybersecurity sloth with Doritos and a packet-sniffing raccoon take turns peeking over a cyan line, checking ports on tiny computers, then vanish.</desc>
  <style>.p{shape-rendering:crispEdges}.t{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}</style>
  <defs><clipPath id="stage"><rect width="1200" height="164"/></clipPath></defs>
  <g clip-path="url(#stage)" class="p">
    <!-- Cybersecurity sloth -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 135;0 135;0 0;0 0;0 135" keyTimes="0;.04;.15;.46;.54" dur="11s" repeatCount="indefinite"/>
      <rect x="828" y="82" width="78" height="75" fill="#665448"/>
      <rect x="840" y="94" width="54" height="49" fill="#D7C4A9"/>
      <path d="M840 101h18l11 15 11-15h14v18h-54z" fill="#827264"/>
      <rect x="851" y="108" width="8" height="8" fill="#171A33"/><rect x="878" y="108" width="8" height="8" fill="#171A33"/>
      <rect x="860" y="129" width="18" height="5" fill="#665448"/>
      <path d="M808 145h118v40H808z" fill="#315D48"/>
      <path d="M822 145l15-15h60l15 15-13 8-10-12h-44l-10 12z" fill="#46785F"/>
      <path d="M785 131h32v52h-32z" fill="#D94432"/>
      <path d="M791 143l19 14-19 13z" fill="#FFB000"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 34;0 34;0 0;0 0;0 34" keyTimes="0;.20;.27;.46;.54" dur="11s" repeatCount="indefinite"/>
        <rect x="916" y="126" width="82" height="55" fill="#34436F"/>
        <rect x="923" y="133" width="68" height="38" fill="#171A33"/>
        <text x="934" y="158" fill="#25C7D9" class="t">:22</text>
      </g>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.13;.18;.45;.50;1" dur="11s" repeatCount="indefinite"/>
      <path d="M569 74h229v49h31l-1 16 18-16h8V74z" fill="#DDF9E8" stroke="#25C7D9" stroke-width="3"/>
      <text x="589" y="104" fill="#20233F" class="t">WHO OPENED PORT 22?</text>
    </g>

    <!-- Packet raccoon -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 135;0 135;0 0;0 0;0 135" keyTimes="0;.54;.65;.92;1" dur="11s" repeatCount="indefinite"/>
      <rect x="187" y="87" width="76" height="68" fill="#8790A1"/>
      <path d="M187 95l-17-17v31h17zm76 0l17-17v31h-17z" fill="#4D5365"/>
      <path d="M198 101h24l3 25h-30zm31 0h24l3 25h-30z" fill="#34384A"/>
      <rect x="205" y="110" width="8" height="8" fill="#8CEAF0"/><rect x="237" y="110" width="8" height="8" fill="#8CEAF0"/>
      <rect x="219" y="131" width="14" height="7" fill="#171A33"/>
      <rect x="171" y="145" width="108" height="40" fill="#263A52"/>
      <rect x="100" y="132" width="79" height="50" fill="#34436F"/>
      <rect x="107" y="139" width="65" height="34" fill="#171A33"/>
      <path d="M114 149h12v5h-12zm18 0h27v5h-27zm-18 11h20v5h-20zm26 0h19v5h-19z" fill="#25C7D9"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.63;.68;.91;1" dur="11s" repeatCount="indefinite"/>
      <path d="M290 74h207v49H326l-17 16 2-16h-21z" fill="#E7EBF3" stroke="#8CEAF0" stroke-width="3"/>
      <text x="311" y="104" fill="#20233F" class="t">THAT PACKET LOOKED SUS.</text>
    </g>
  </g>
  <rect y="162" width="1200" height="4" fill="#25C7D9"/>
  <rect x="0" y="162" width="92" height="4" fill="#F46A5A"/><rect x="1108" y="162" width="92" height="4" fill="#8CEAF0"/>
  <rect x="18" y="176" width="7" height="7" fill="#FFB000"/><rect x="1175" y="176" width="7" height="7" fill="#25C7D9"/>
</svg>
