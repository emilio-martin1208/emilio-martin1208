<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">The tiny software engineering team</title>
  <desc id="desc">Four animated pixel characters pop out of code windows with jokes about local builds, rubber duck debugging, tiny fixes, and shipping.</desc>
  <style>
    .pixel { shape-rendering: crispEdges; }
    .label { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .tiny { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
  </style>

  <rect width="1200" height="390" fill="#171A33"/>
  <rect x="16" y="16" width="1168" height="358" fill="#20233F" stroke="#25C7D9" stroke-width="4"/>
  <rect x="32" y="32" width="8" height="8" fill="#8CEAF0"/>
  <rect x="1160" y="32" width="8" height="8" fill="#F46A5A"/>
  <rect x="32" y="350" width="8" height="8" fill="#FFB000"/>
  <rect x="1160" y="350" width="8" height="8" fill="#8CEAF0"/>

  <text x="56" y="67" fill="#8CEAF0" class="label">MEET THE TINY ENGINEERING TEAM</text>
  <text x="56" y="93" fill="#7686B9" class="tiny">ON CALL. OVER CAFFEINATED. SOMEHOW SHIPPING.</text>
  <rect x="56" y="108" width="1088" height="4" fill="#2C3158"/>
  <rect x="56" y="108" width="210" height="4" fill="#25C7D9"/>

  <!-- Character one: local build wizard -->
  <g class="pixel">
    <rect x="56" y="138" width="250" height="196" fill="#171A33" stroke="#3D4E80" stroke-width="4"/>
    <rect x="56" y="138" width="250" height="24" fill="#29325B"/>
    <rect x="70" y="147" width="7" height="7" fill="#F46A5A"/><rect x="84" y="147" width="7" height="7" fill="#FFB000"/><rect x="98" y="147" width="7" height="7" fill="#25C7D9"/>
    <path d="M76 182h34v5H76zm0 13h58v5H76zm0 13h45v5H76z" fill="#3D4E80"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 75;0 0;0 0;0 75" keyTimes="0;.18;.76;1" dur="5.6s" begin="0s" repeatCount="indefinite"/>
      <rect x="151" y="224" width="62" height="62" fill="#25C7D9"/>
      <rect x="143" y="238" width="78" height="50" fill="#25C7D9"/>
      <rect x="151" y="238" width="62" height="50" fill="#8CEAF0"/>
      <rect x="143" y="224" width="16" height="16" fill="#26305C"/><rect x="205" y="224" width="16" height="16" fill="#26305C"/>
      <rect x="164" y="252" width="8" height="8" fill="#171A33"/><rect x="192" y="252" width="8" height="8" fill="#171A33"/>
      <rect x="176" y="270" width="16" height="6" fill="#171A33"/>
      <rect x="126" y="286" width="112" height="48" fill="#314071"/>
      <rect x="136" y="298" width="92" height="36" fill="#20233F"/>
      <path d="M151 310h10v6h-10zm16 0h10v6h-10zm16 0h10v6h-10zm16 0h10v6h-10z" fill="#25C7D9"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.18;.76;1" dur="5.6s" begin="0s" repeatCount="indefinite"/>
      <path d="M112 174h157v42h-59l-10 12-2-12h-86z" fill="#EEFDFE"/>
      <text x="125" y="200" fill="#20233F" class="tiny">WORKS LOCALLY</text>
    </g>
  </g>

  <!-- Character two: rubber duck debugger -->
  <g class="pixel">
    <rect x="326" y="138" width="250" height="196" fill="#171A33" stroke="#3D4E80" stroke-width="4"/>
    <rect x="326" y="138" width="250" height="24" fill="#29325B"/>
    <rect x="340" y="147" width="7" height="7" fill="#F46A5A"/><rect x="354" y="147" width="7" height="7" fill="#FFB000"/><rect x="368" y="147" width="7" height="7" fill="#25C7D9"/>
    <path d="M346 182h49v5h-49zm0 13h72v5h-72zm0 13h34v5h-34z" fill="#3D4E80"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 75;0 75;0 0;0 0;0 75" keyTimes="0;.12;.3;.78;1" dur="5.6s" begin="0s" repeatCount="indefinite"/>
      <rect x="414" y="235" width="70" height="55" fill="#FFB000"/>
      <rect x="428" y="219" width="48" height="28" fill="#FFD35A"/>
      <rect x="469" y="229" width="24" height="10" fill="#F46A5A"/>
      <rect x="462" y="225" width="7" height="7" fill="#171A33"/>
      <rect x="400" y="278" width="98" height="18" fill="#FFD35A"/>
      <rect x="390" y="293" width="118" height="41" fill="#314071"/>
      <rect x="405" y="303" width="88" height="31" fill="#20233F"/>
      <path d="M418 313h8v6h-8zm14 0h8v6h-8zm14 0h8v6h-8zm14 0h8v6h-8z" fill="#FFB000"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.12;.3;.78;1" dur="5.6s" begin="0s" repeatCount="indefinite"/>
      <path d="M367 174h169v42h-70l-10 12-2-12h-87z" fill="#FFF4D0"/>
      <text x="381" y="200" fill="#20233F" class="tiny">EXPLAIN IT AGAIN</text>
    </g>
  </g>

  <!-- Character three: one tiny fix -->
  <g class="pixel">
    <rect x="596" y="138" width="250" height="196" fill="#171A33" stroke="#3D4E80" stroke-width="4"/>
    <rect x="596" y="138" width="250" height="24" fill="#29325B"/>
    <rect x="610" y="147" width="7" height="7" fill="#F46A5A"/><rect x="624" y="147" width="7" height="7" fill="#FFB000"/><rect x="638" y="147" width="7" height="7" fill="#25C7D9"/>
    <path d="M616 182h61v5h-61zm0 13h39v5h-39zm0 13h80v5h-80z" fill="#3D4E80"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 75;0 75;0 0;0 0;0 75" keyTimes="0;.25;.43;.82;1" dur="5.6s" begin="0s" repeatCount="indefinite"/>
      <rect x="684" y="229" width="76" height="63" fill="#F46A5A"/>
      <rect x="696" y="239" width="52" height="47" fill="#FFD6CE"/>
      <rect x="684" y="229" width="76" height="16" fill="#9E3340"/>
      <rect x="704" y="253" width="8" height="8" fill="#171A33"/><rect x="732" y="253" width="8" height="8" fill="#171A33"/>
      <rect x="716" y="271" width="16" height="6" fill="#9E3340"/>
      <rect x="665" y="286" width="114" height="48" fill="#9E3340"/>
      <rect x="682" y="299" width="80" height="35" fill="#20233F"/>
      <rect x="768" y="275" width="20" height="32" fill="#8CEAF0"/><rect x="772" y="280" width="12" height="17" fill="#20233F"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.25;.43;.82;1" dur="5.6s" begin="0s" repeatCount="indefinite"/>
      <path d="M638 174h166v42h-66l-10 12-2-12h-88z" fill="#FFE4DE"/>
      <text x="657" y="200" fill="#20233F" class="tiny">ONE TINY FIX</text>
    </g>
  </g>

  <!-- Character four: deploy goblin -->
  <g class="pixel">
    <rect x="866" y="138" width="278" height="196" fill="#171A33" stroke="#3D4E80" stroke-width="4"/>
    <rect x="866" y="138" width="278" height="24" fill="#29325B"/>
    <rect x="880" y="147" width="7" height="7" fill="#F46A5A"/><rect x="894" y="147" width="7" height="7" fill="#FFB000"/><rect x="908" y="147" width="7" height="7" fill="#25C7D9"/>
    <path d="M886 182h45v5h-45zm0 13h68v5h-68zm0 13h54v5h-54z" fill="#3D4E80"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 75;0 75;0 0;0 0;0 75" keyTimes="0;.38;.56;.86;1" dur="5.6s" begin="0s" repeatCount="indefinite"/>
      <rect x="960" y="233" width="82" height="57" fill="#25C7D9"/>
      <rect x="949" y="245" width="104" height="45" fill="#25C7D9"/>
      <rect x="971" y="247" width="60" height="39" fill="#C5FAFC"/>
      <rect x="949" y="233" width="20" height="18" fill="#25C7D9"/><rect x="1033" y="233" width="20" height="18" fill="#25C7D9"/>
      <rect x="979" y="257" width="9" height="9" fill="#171A33"/><rect x="1014" y="257" width="9" height="9" fill="#171A33"/>
      <rect x="991" y="273" width="20" height="7" fill="#25C7D9"/>
      <rect x="941" y="286" width="120" height="48" fill="#284C69"/>
      <rect x="958" y="299" width="86" height="35" fill="#20233F"/>
      <path d="M971 311h9v7h-9zm15 0h9v7h-9zm15 0h9v7h-9zm15 0h9v7h-9z" fill="#8CEAF0"/>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.38;.56;.86;1" dur="5.6s" begin="0s" repeatCount="indefinite"/>
      <path d="M918 174h174v42h-68l-10 12-2-12h-94z" fill="#D9FBFC"/>
      <text x="963" y="200" fill="#20233F" class="tiny">SHIP IT!</text>
    </g>
  </g>

  <rect x="56" y="334" width="1088" height="4" fill="#2C3158"/>
  <rect x="82" y="352" width="8" height="8" fill="#25C7D9"/>
  <rect x="100" y="352" width="8" height="8" fill="#3D4E80"/>
  <rect x="1118" y="352" width="8" height="8" fill="#F46A5A"/>
</svg>
