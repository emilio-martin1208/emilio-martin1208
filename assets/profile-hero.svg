<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Emilio Martin, product engineer and indie builder</title>
  <desc id="desc">A dark purple and coral banner connecting product, systems, and creative code.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090F"/>
      <stop offset="0.52" stop-color="#121024"/>
      <stop offset="1" stop-color="#160D1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="78" x2="793" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="glow" x1="778" y1="49" x2="1107" y2="377" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur" x="664" y="-64" width="600" height="600" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="964" cy="186" r="230" fill="url(#glow)" filter="url(#blur)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="72" y="66" width="54" height="8" rx="4" fill="#A78BFA"/>
    <rect x="132" y="66" width="18" height="8" rx="4" fill="#FB7185"/>
    <text x="72" y="144" fill="#F7F5FF" font-size="58" font-weight="700" letter-spacing="-2">Emilio Martin</text>
    <text x="74" y="193" fill="url(#accent)" font-size="24" font-weight="600">PRODUCT ENGINEER / INDIE BUILDER</text>
    <text x="74" y="251" fill="#B8B4C7" font-size="20">I build the whole thing.</text>
    <text x="74" y="283" fill="#77728A" font-size="18">AI systems · useful products · creative code</text>

    <g transform="translate(790 72)">
      <path d="M55 70C110 14 203 10 266 54C329 98 328 194 260 239C192 284 101 268 64 209" stroke="#A78BFA" stroke-opacity="0.34" stroke-width="2" stroke-dasharray="7 9"/>
      <path d="M57 71L148 146L260 238" stroke="#F7F5FF" stroke-opacity="0.18" stroke-width="2"/>
      <circle cx="55" cy="70" r="34" fill="#17132A" stroke="#A78BFA" stroke-width="2"/>
      <circle cx="148" cy="146" r="42" fill="#17132A" stroke="#C084FC" stroke-width="2"/>
      <circle cx="260" cy="238" r="34" fill="#21121F" stroke="#FB7185" stroke-width="2"/>
      <circle cx="55" cy="70" r="7" fill="#A78BFA"/>
      <circle cx="148" cy="146" r="9" fill="#C084FC"/>
      <circle cx="260" cy="238" r="7" fill="#FB7185"/>
      <text x="55" y="125" fill="#8E899F" font-size="14" text-anchor="middle">PRODUCT</text>
      <text x="148" y="209" fill="#8E899F" font-size="14" text-anchor="middle">SYSTEMS</text>
      <text x="260" y="293" fill="#8E899F" font-size="14" text-anchor="middle">CRAFT</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="23" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
