<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Emilio Martin — product engineer</title>
  <desc id="desc">A compact deep-indigo title card with cyan and amber accents.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20233F"/>
      <stop offset="1" stop-color="#17172A"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#surface)"/>
  <rect x="1" y="1" width="1198" height="258" fill="none" stroke="#8CEAF0" stroke-opacity="0.18" stroke-width="2"/>
  <rect x="64" y="54" width="5" height="152" fill="#25C7D9"/>

  <text class="mono" x="96" y="82" fill="#8CEAF0" font-size="12" font-weight="700" letter-spacing="2.2">EMILIO MARTIN</text>
  <text class="sans" x="96" y="145" fill="#F7FBFC" font-size="48" font-weight="700" letter-spacing="-1.8">Developing...</text>
  <text class="sans" x="96" y="184" fill="#C7CEDF" font-size="19">(I have no idea what I'm doing) · AI systems · Cybersecurity · FinTech · Hardware</text>

  <g transform="translate(1052 66)">
    <text class="mono" x="0" y="0" fill="#858EAC" font-size="12" font-weight="700" letter-spacing="1.8">CURRENT</text>
    <text class="sans" x="0" y="37" fill="#F7FBFC" font-size="20" font-weight="650">Laneway</text>
    <path d="M0 62H84" stroke="#25C7D9" stroke-width="2"/>
    <circle cx="84" cy="62" r="5" fill="#FFB000"/>
  </g>
</svg>
